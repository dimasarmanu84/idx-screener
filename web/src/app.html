<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>IDX Stock Screener</title>
		<meta name="description" content="Screener saham IDX — BSJP, Intraday, Swing, Top Gainer" />
		<meta name="theme-color" content="#0a0e17" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="IDX Screener" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-192.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<script src="https://accounts.google.com/gsi/client" async defer></script>
		%sveltekit.head%
		<script>
			const theme = localStorage.getItem('color-theme') || 'dark';
			if (theme === 'dark') document.documentElement.classList.add('dark');
		</script>
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-gray-50 font-sans antialiased dark:bg-terminal-bg">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
